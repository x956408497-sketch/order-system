spring.application.name=order-system
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/order_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.xiong.ordersystem.entity

# Fill these for real WeChat login. Leave empty to use local demo login.
wechat.app-id=${WECHAT_APP_ID:}
wechat.app-secret=${WECHAT_APP_SECRET:}
